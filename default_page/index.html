<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Ready</title>
    <style>
        :root {
            --primary: #6366f1;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Prevent scrolling */
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3.5rem 2.5rem;
            border-radius: 24px;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 10px 15px -3px rgba(0, 0, 0, 0.05),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0 0 1rem;
            color: #111827;
            letter-spacing: -0.035em;
            line-height: 1.1;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0 0 2rem;
            font-weight: 450;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background-color: #f0fdf4;
            color: #166534;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1px solid #bbf7d0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
            box-shadow: 0 0 0 3px #dcfce7;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #9ca3af;
            font-weight: 500;
            opacity: 0.8;
            letter-spacing: 0.025em;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>It Works!</h1>
        <p>Your server is running perfectly. This placeholder appears because no specific host matched the request.</p>

        <div class="status-badge">
            <span class="status-dot"></span>
            System Operational
        </div>

        <div class="footer">
            POWERED BY CADDY PROXY MANAGER
        </div>
    </div>
</body>

</html>
